const guide='<h4>Connect a database</h4><ol class="steps2"><li>Make a free project at supabase.com</li><li>Open its SQL Editor, paste everything from supabase-setup.sql (change CHANGE-ME to your own secret first), and press Run</li><li>Copy the Project URL and the anon public key from Project Settings, then API</li><li>Paste them in the 🗄️ database tab, press Save, then Download site and upload it to your host</li></ol>';
if(!url||!key){let L={};try{L=JSON.parse(localStorage.getItem('rd_local')||'{}')}catch(e){}
w.innerHTML='<h4>Visitor stats</h4><p class="hint">No database connected yet, so these numbers only count visits from this device.</p><div class="kpi"><div><b>'+(+L.visits||0)+'</b><span>Visits on this device</span></div><div><b>'+(+L.messages||0)+'</b><span>Messages sent</span></div></div>'+guide;return}
const pw=SS.get('statpw');
if(!pw){w.innerHTML='<h4>Visitor stats</h4><p class="hint">Enter your stats password, the secret you set in the SQL file.</p>';const b=mk('button','btn main','Enter password');b.onclick=()=>ask('Stats password','Show stats',v=>{if(!v)return 'Enter the password.';SS.set('statpw',v);statsView(B)},true);w.append(b);return}
w.innerHTML='<p class="hint">Loading...</p>';
try{const r=await fetch(url+'/rest/v1/rpc/get_stats',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({pw})});
if(!r.ok){SS.set('statpw','');w.innerHTML='<p class="hint">Could not load stats. The password may be wrong or the SQL setup is not finished.</p>';const b=mk('button','mini','Try again');b.onclick=()=>statsView(B);w.append(b);w.insertAdjacentHTML('beforeend',guide);return}
const ST=await r.json(),map={};(ST.daily||[]).forEach(d=>map[String(d.day).slice(0,10)]=+d.n);
const days=[];for(let i=13;i>=0;i--){const k=new Date(Date.now()-i*864e5).toISOString().slice(0,10);days.push([k,map[k]||0])}const mx=Math.max(1,...days.map(d=>d[1]));
const list=(a,f)=>(a&&a.length?a.map(f).join(''):'<div><span>No data yet</span></div>');
w.innerHTML=`<h4>Visitors</h4><div class="kpi"><div><b>${+ST.total||0}</b><span>Total visits</span></div><div><b>${+ST.unique||0}</b><span>Unique visitors</span></div><div><b>${+ST.today||0}</b><span>Today</span></div><div><b>${+ST.week||0}</b><span>Last 7 days</span></div><div><b>${+ST.messages||0}</b><span>Messages sent</span></div><div><b>${(ST.admins||[]).length}</b><span>Devs on the panel</span></div></div>
<h4>Last 14 days</h4><div class="bars">${days.map(d=>`<i title="${d[0]}: ${d[1]}" style="height:${Math.max(3,d[1]/mx*100)}%"></i>`).join('')}</div>
<h4>Most viewed sections</h4><div class="lst">${list(ST.sections,s=>`<div><span>${esc(s.label)}</span><b>${+s.n}</b></div>`)}</div>
<h4>Devices</h4><div class="lst">${list(ST.devices,s=>`<div><span>${esc(s.device)}</span><b>${+s.n}</b></div>`)}</div>
<h4>Where visitors come from</h4><div class="lst">${list(ST.refs,s=>`<div><span>${esc(s.ref)}</span><b>${+s.n}</b></div>`)}</div>
<h4>Devs and admins on the panel</h4><div class="lst">${list(ST.admins,s=>`<div><span>${esc(s.name)} · ${+s.logins} login${+s.logins>1?'s':''}</span><b>${esc(new Date(s.last_seen).toLocaleDateString())}</b></div>`)}</div>`;
const rb=mk('button','mini','Refresh');rb.style.marginTop='14px';rb.onclick=()=>statsView(B);w.append(rb)}catch(e){w.innerHTML='<p class="hint">Could not reach the database. Check the URL and key in the database tab.</p>'}}

{const fb=document.getElementById('fab'),mq=matchMedia('(max-width:760px)'),lab=()=>{if(fb)fb.textContent=mq.matches?'⚙':'⚙ Admin'};lab();mq.addEventListener&&mq.addEventListener('change',lab)}

// phone: move the theme and effects buttons out of the bottom bar into a small top-right group
{const nav=document.querySelector('nav.glass'),th=document.getElementById('theme'),fx=document.getElementById('fxb'),mq=matchMedia('(max-width:760px)'),
tools=document.createElement('div');tools.id='mtools';tools.dataset.gen=1;document.body.append(tools);

// smooth tilt engine with depth parallax, animated border and arrival sweep on every card
document.querySelectorAll('.card').forEach(c=>c.prepend(mk('i','sw'),mk('i','bd')));
const TC=new Map();
document.querySelectorAll('.card').forEach(el=>{if(el.parentElement.id==='skills')return;
el.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=el.getBoundingClientRect();if(!r.width||!r.height)return;let st=TC.get(el);if(!st){st={x:0,y:0,l:0,tx:0,ty:0,tl:1};TC.set(el,st)}st.tx=((e.clientX-r.left)/r.width-.5)*2;st.ty=(.5-(e.clientY-r.top)/r.height)*2;st.tl=1});
el.addEventListener('pointerleave',()=>{const st=TC.get(el);if(st){st.tx=st.ty=st.tl=0}})});
(function tl(){const TK=1-Math.pow(.89,DT);TC.forEach((st,el)=>{st.x+=(st.tx-st.x)*TK;st.y+=(st.ty-st.y)*TK;st.l+=(st.tl-st.l)*TK;
el.style.transform=`perspective(900px) translateY(${(-st.l*7).toFixed(2)}px) rotateX(${(st.y*7).toFixed(2)}deg) rotateY(${(st.x*7).toFixed(2)}deg) scale(${(1+st.l*.015).toFixed(4)})`;
el.style.setProperty('--px',st.x.toFixed(3));el.style.setProperty('--py',st.y.toFixed(3));
if(!st.tl&&Math.abs(st.x)<.003&&Math.abs(st.y)<.003&&st.l<.003){el.style.transform='';el.style.removeProperty('--px');el.style.removeProperty('--py');TC.delete(el)}});
requestAnimationFrame(tl)})();
